name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing version tag to build, for example v1.1.1'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured."
            exit 1
          }

      - name: Enable updater artifacts
        run: |
          node -e "const fs=require('fs'); const file='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(file, 'utf8')); config.bundle={...(config.bundle||{}), createUpdaterArtifacts:true}; fs.writeFileSync(file, JSON.stringify(config, null, 2)+'\n');"

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APPS_SCRIPT_URL: 'https://script.google.com/a/*/macros/s/AKfycbzRHcYZzNof6_5CihFIkGeD8zF-pEK3KPkcc0aUmyUBGG4H28FToeq6EzOryuevmSQ/exec'
          VITE_APPS_SCRIPT_ADMIN_URL: 'https://script.google.com/macros/s/AKfycbzNJQt0z3I18_iFfgjIjQd4-db_VY38w9KziyoPtxUQYBd7lAdFQTSP0-VU2v9VVoDqkg/exec'
          VITE_APPS_SCRIPT_ADMIN_SECRET: ${{ secrets.VITE_APPS_SCRIPT_SYNC_SECRET }}
          VITE_SECURITY_ATTENDANCE_SECRET: ${{ secrets.VITE_SECURITY_ATTENDANCE_SECRET }}
          VITE_INSPECTION_ACCESS_TOKEN: ${{ secrets.VITE_INSPECTION_ACCESS_TOKEN }}
          VITE_ADMIN_BUILD: 'false'
          VITE_MASTER_NODE: 'false'
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Oasis Pendataan Karyawan ${{ inputs.tag_name || github.ref_name }}'
          releaseBody: 'Automatic build generated by GitHub Actions.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify published latest.json
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-verification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir updater-verification \
            --clobber

          test -s updater-verification/latest.json
          echo "Downloaded updater manifest from release: $RELEASE_TAG"
          echo "Manifest SHA-256: $(sha256sum updater-verification/latest.json | cut -d ' ' -f 1)"

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('updater-verification/latest.json', 'utf8'));
          const platforms = Object.entries(manifest.platforms ?? {});

          if (!manifest.version || platforms.length === 0) {
            throw new Error('latest.json is missing version or platform entries');
          }

          console.log(`Manifest version: ${manifest.version}`);
          console.log(`Manifest published date: ${manifest.pub_date ?? '(not provided)'}`);
          for (const [platform, artifact] of platforms) {
            if (!artifact.url || !artifact.signature) {
              throw new Error(`Platform ${platform} is missing url or signature`);
            }
            console.log(`Platform: ${platform}`);
            console.log(`  URL: ${artifact.url}`);
            console.log(`  Signature: present (${artifact.signature.length} characters)`);
          }
          console.log('latest.json verification: PASSED');
          NODE

  release-windows7-compatibility:
    name: Build Windows 7 compatibility installer
    needs: release
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Download Windows 7 compatible WebView2 runtime
        shell: pwsh
        env:
          WEBVIEW2_FIXED_RUNTIME_URL: https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab
          WEBVIEW2_FIXED_RUNTIME_SHA256: 7622281CF83DE1A35E3A471F432F7A897D65F0A7D3975DF08512B7B253DD45C7
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri'
          $runtimeDir = Join-Path $runtimeRoot 'Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64'
          $cabPath = Join-Path $env:RUNNER_TEMP 'Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab'
          Invoke-WebRequest -Uri $env:WEBVIEW2_FIXED_RUNTIME_URL -OutFile $cabPath
          $hash = (Get-FileHash $cabPath -Algorithm SHA256).Hash
          if ($hash -ne $env:WEBVIEW2_FIXED_RUNTIME_SHA256) { throw "WebView2 runtime checksum mismatch: $hash" }
          & "$env:SystemRoot\System32\expand.exe" -F:* $cabPath $runtimeRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract WebView2 fixed runtime" }
          if (-not (Test-Path (Join-Path $runtimeDir 'msedgewebview2.exe'))) {
            throw "Extracted WebView2 runtime is incomplete"
          }

      - name: Build Windows 7 compatibility installer
        env:
          VITE_APPS_SCRIPT_URL: 'https://script.google.com/a/*/macros/s/AKfycbzRHcYZzNof6_5CihFIkGeD8zF-pEK3KPkcc0aUmyUBGG4H28FToeq6EzOryuevmSQ/exec'
          VITE_APPS_SCRIPT_ADMIN_URL: 'https://script.google.com/macros/s/AKfycbzNJQt0z3I18_iFfgjIjQd4-db_VY38w9KziyoPtxUQYBd7lAdFQTSP0-VU2v9VVoDqkg/exec'
          VITE_APPS_SCRIPT_ADMIN_SECRET: ${{ secrets.VITE_APPS_SCRIPT_SYNC_SECRET }}
          VITE_SECURITY_ATTENDANCE_SECRET: ${{ secrets.VITE_SECURITY_ATTENDANCE_SECRET }}
          VITE_INSPECTION_ACCESS_TOKEN: ${{ secrets.VITE_INSPECTION_ACCESS_TOKEN }}
          VITE_ADMIN_BUILD: 'false'
          VITE_MASTER_NODE: 'false'
        run: npm run tauri:build:win7

      - name: Upload Windows 7 installer as separate release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SOURCE=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -type f -name '*-setup.exe' | head -n 1)
          test -n "$SOURCE"
          ASSET="Pendataan Karyawan OASIS_${VERSION}_Windows7_x64-setup.exe"
          cp "$SOURCE" "$ASSET"
          gh release upload "$RELEASE_TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
