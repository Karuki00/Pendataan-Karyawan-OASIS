name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing version tag to build, for example v1.1.1'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured."
            exit 1
          }

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_ADMIN_URL: ${{ secrets.VITE_APPS_SCRIPT_ADMIN_URL }}
          VITE_APPS_SCRIPT_ADMIN_SECRET: ${{ secrets.VITE_APPS_SCRIPT_SYNC_SECRET }}
          VITE_SECURITY_ATTENDANCE_SECRET: ${{ secrets.VITE_SECURITY_ATTENDANCE_SECRET }}
          VITE_INSPECTION_ACCESS_TOKEN: ${{ secrets.VITE_INSPECTION_ACCESS_TOKEN }}
          VITE_ADMIN_BUILD: 'false'
          VITE_MASTER_NODE: 'false'
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: 'Oasis Pendataan Karyawan ${{ inputs.tag_name || github.ref_name }}'
          releaseBody: 'Automatic build generated by GitHub Actions.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Publish updater archive and manifest
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nsis_zip="$(find src-tauri/target/release/bundle/nsis -type f -name '*.nsis.zip' -print -quit)"
          nsis_sig="${nsis_zip}.sig"
          test -s "$nsis_zip"
          test -s "$nsis_sig"

          gh release upload "$RELEASE_TAG" "$nsis_zip" "$nsis_sig" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          NSIS_ZIP="$nsis_zip" NSIS_SIG="$nsis_sig" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const zipName = path.basename(process.env.NSIS_ZIP);
          const signature = fs.readFileSync(process.env.NSIS_SIG, 'utf8').trim();
          const version = tag.replace(/^v/, '');
          const encodedZipName = encodeURIComponent(zipName);

          const manifest = {
            version,
            notes: `Automatic build generated by GitHub Actions for ${tag}.`,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature,
                url: `https://github.com/${repository}/releases/download/${tag}/${encodedZipName}`,
              },
            },
          };

          fs.writeFileSync('latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          gh release upload "$RELEASE_TAG" latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published latest.json
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-verification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir updater-verification \
            --clobber

          test -s updater-verification/latest.json
          echo "Downloaded updater manifest from release: $RELEASE_TAG"
          echo "Manifest SHA-256: $(sha256sum updater-verification/latest.json | cut -d ' ' -f 1)"

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('updater-verification/latest.json', 'utf8'));
          const platforms = Object.entries(manifest.platforms ?? {});

          if (!manifest.version || platforms.length === 0) {
            throw new Error('latest.json is missing version or platform entries');
          }

          console.log(`Manifest version: ${manifest.version}`);
          console.log(`Manifest published date: ${manifest.pub_date ?? '(not provided)'}`);
          for (const [platform, artifact] of platforms) {
            if (!artifact.url || !artifact.signature) {
              throw new Error(`Platform ${platform} is missing url or signature`);
            }
            console.log(`Platform: ${platform}`);
            console.log(`  URL: ${artifact.url}`);
            console.log(`  Signature: present (${artifact.signature.length} characters)`);
          }
          console.log('latest.json verification: PASSED');
          NODE
